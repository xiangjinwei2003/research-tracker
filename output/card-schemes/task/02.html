<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>任务方案 2</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #151517;
    color: #f2f2f4;
    font: 14px/1.45 ui-sans-serif, system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 28px 20px 64px; }
  .kicker { margin: 0; color: #89898d; font-size: 11px; letter-spacing: 0.12em; }
  .scheme { margin: 8px 0 0; font-size: 22px; font-weight: 650; }
  .interaction { margin: 8px 0 18px; color: #aaaab3; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .card {
    width: min(420px, 100%);
    padding: 14px;
    border: 1px solid #323236;
    border-radius: 12px;
    background: #222225;
  }
  .name, .project {
    display: inline-block;
    max-width: 100%;
    padding: 2px 8px;
    border-radius: 999px;
    background: #6f8cff;
    color: #16161a;
    font-size: 13px;
    font-weight: 650;
  }
  .stage, .venue {
    display: inline-block;
    margin-right: 6px;
    padding: 1px 8px;
    border: 1px solid #323236;
    border-radius: 999px;
    color: #aaaab3;
    font-size: 11px;
  }
  .deadline, .due { color: #efa768; }
  .todo-due { color: #ef8396; }
  .track { display: block; height: 6px; overflow: hidden; border-radius: 999px; background: #29292e; }
  .fill { display: block; width: 25%; height: 100%; background: #6f8cff; }
  .check, .add, .open, .complete, .focus {
    border: 1px solid #3a3a40;
    border-radius: 8px;
    background: #29292e;
  }
  h2 { margin: 0; font-size: 16px; font-weight: 650; }
  p { margin: 0; }
</style>
<style id="card-treatment">
.card { display: grid; grid-template-columns: auto auto auto auto minmax(0, 1fr) auto auto; gap: 8px 10px; align-items: center; width: 100%; }
.project { grid-column: 1; grid-row: 1; }
.title { grid-column: 2 / 6; grid-row: 1; font-size: 15px; white-space: nowrap; }
.due { grid-column: 6 / -1; grid-row: 1; justify-self: end; white-space: nowrap; }
.notes { grid-column: 1; grid-row: 2; color: #89898d; font-size: 12px; white-space: nowrap; }
.pin { grid-column: 2; grid-row: 2; color: #89898d; font-size: 12px; white-space: nowrap; }
.people { grid-column: 3; grid-row: 2; color: #89898d; font-size: 12px; white-space: nowrap; }
.minutes { grid-column: 4; grid-row: 2; color: #89898d; font-size: 12px; white-space: nowrap; }
.complete { grid-column: 6; grid-row: 2; min-height: 32px; padding: 0 12px; }
.focus { grid-column: 7; grid-row: 2; min-height: 32px; padding: 0 12px; }
</style>
</head>
<body>
<main>
  <p class="kicker">矩形卡片</p>
  <h1 class="scheme">任务方案 2</h1>
  <p class="interaction">矩形压成两行，身份、标题、日期在第一行，行动在第二行。</p>
  <!-- facts-start -->
<article class="card" data-sample-card>
  <span class="project">注意力机制综述</span>
  <h2 class="title">补全第三周的文献矩阵</h2>
  <p class="notes">只保留有全文的条目</p>
  <span class="due">逾期 · 9月30日</span>
  <span class="pin">手动加入</span>
  <span class="people">林可</span>
  <span class="minutes">45 分钟</span>
  <button type="button" class="complete">完成</button>
  <button type="button" class="focus">专注</button>
</article>
  <!-- facts-end -->
</main>
</body>
</html>
